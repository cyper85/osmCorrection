<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osmCorrection</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- texts come from src/locales/*.ts (data-i18n…), filled in by main.ts -->
    <aside id="sidebar">
      <header>
        <img src="./logo.svg" alt="" width="32" height="32" />
        <h1>osmCorrection</h1>
      </header>

      <p id="user" class="user" hidden>
        <span data-i18n="user.loggedInAs"></span> <strong id="user-name"></strong>
        <button type="button" id="logout" class="link" data-i18n="user.logout"></button>
      </p>

      <p id="error" class="error" role="alert" hidden></p>

      <section id="step-login">
        <h2><span data-i18n="login.title"></span> <a class="help" data-help="start" data-i18n-title="app.helpStep" data-i18n-aria-label="app.helpStep">?</a></h2>
        <p data-i18n="login.intro"></p>
        <div class="row">
          <button type="button" id="login" class="primary" data-i18n="login.button"></button>
          <button type="button" id="guest" data-i18n="login.guest"></button>
        </div>
        <p class="hint" data-i18n="login.guestHint"></p>
        <p id="config-warning" class="error" data-i18n-html="login.noClientId" hidden></p>
      </section>

      <section id="step-select" hidden>
        <h2><span data-i18n="select.title"></span> <a class="help" data-help="select" data-i18n-title="app.helpStep" data-i18n-aria-label="app.helpStep">?</a></h2>
        <div id="pending" class="notice" hidden>
          <p><strong id="pending-count"></strong> <span data-i18n="select.pendingSuffix"></span></p>
          <div class="row">
            <button type="button" id="pending-upload" class="primary" data-i18n="select.pendingUpload"></button>
            <button type="button" id="pending-discard" data-i18n="select.pendingDiscard"></button>
          </div>
        </div>
        <form id="search-form" class="row">
          <input type="search" id="search" data-i18n-placeholder="select.search" data-i18n-aria-label="select.search" />
          <button type="submit" data-i18n="select.searchButton"></button>
        </form>
        <p data-i18n="select.intro"></p>
        <fieldset id="checks"></fieldset>
        <fieldset id="online-checks">
          <legend data-i18n="select.onlineChecks"></legend>
        </fieldset>
        <fieldset id="assist-settings" hidden>
          <legend data-i18n="ai.settings"></legend>
          <label for="ai-key" data-i18n="ai.key"></label>
          <input type="password" id="ai-key" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" />
          <label><input type="checkbox" id="ai-remember" /> <span data-i18n="ai.remember"></span></label>
          <label for="ai-model" data-i18n="ai.model"></label>
          <select id="ai-model"></select>
          <p id="ai-cost" class="hint"></p>
          <p class="hint" data-i18n-html="ai.keyHint"></p>
          <p class="hint"><a data-help="ai-key" data-i18n="app.helpMore"></a></p>
        </fieldset>
        <div class="row">
          <button type="button" id="download" class="primary" data-i18n="select.download"></button>
          <button type="button" id="export-claude" class="primary" data-i18n="select.exportAi"></button>
        </div>
        <p id="download-hint" class="hint"></p>
        <fieldset id="claude-code">
          <legend data-i18n="agent.title"></legend>
          <p class="hint" data-i18n-html="agent.intro"></p>
          <p id="export-hint" class="hint" hidden></p>
          <div class="row">
            <button type="button" id="import-claude" data-i18n="agent.import"></button>
            <input type="file" id="import-folder" webkitdirectory multiple hidden />
          </div>
          <form id="import-confirm" class="notice" hidden>
            <p id="import-stated"></p>
            <label for="import-vendor" data-i18n-html="agent.vendor"></label>
            <select id="import-vendor"></select>
            <input id="import-vendor-other" data-i18n-placeholder="agent.vendorOther" hidden />
            <label for="import-model" data-i18n="agent.modelLabel"></label>
            <input id="import-model" data-i18n-placeholder="agent.modelPlaceholder" autocomplete="off" spellcheck="false" />
            <p class="hint" data-i18n="agent.vendorHint"></p>
            <div class="row">
              <button type="submit" id="import-confirm-ok" class="primary" data-i18n="agent.importButton"></button>
              <button type="button" id="import-confirm-cancel" data-i18n="agent.cancel"></button>
            </div>
          </form>
          <p class="hint" data-i18n-html="agent.folderHint"></p>
          <p class="hint"><a data-help="ai-agent" data-i18n="app.helpMore"></a></p>
        </fieldset>
      </section>

      <section id="step-review" hidden>
        <h2><span data-i18n="review.title"></span> <a class="help" data-help="review" data-i18n-title="app.helpStep" data-i18n-aria-label="app.helpStep">?</a></h2>
        <p id="progress" class="hint"></p>
        <p id="review-notice" class="notice" hidden></p>
        <div id="issue">
          <p class="element">
            <a id="issue-link" target="_blank" rel="noopener"></a>
          </p>
          <dl>
            <dt data-i18n="review.tag"></dt>
            <dd><code id="issue-key"></code></dd>
            <dt data-i18n="review.value"></dt>
            <dd><code id="issue-value"></code></dd>
            <dt data-i18n="review.finding"></dt>
            <dd id="issue-message" class="message"></dd>
          </dl>
          <blockquote id="issue-quote" hidden>
            <p id="issue-quote-text"></p>
            <a id="issue-quote-link" target="_blank" rel="noopener noreferrer"></a>
          </blockquote>
          <div id="assist" class="notice" hidden>
            <div class="row">
              <button type="button" id="assist-run" class="primary"></button>
              <button type="button" id="assist-cancel" data-i18n="assist.cancel" hidden></button>
            </div>
            <p id="assist-status" class="hint"></p>
            <ul id="assist-details" class="hint"></ul>
          </div>
          <form id="issue-form">
            <label for="issue-input" data-i18n="review.newValue"></label>
            <input id="issue-input" autocomplete="off" spellcheck="false" />
            <p id="issue-check" class="hint"></p>
            <p id="issue-open-row" hidden>
              <a id="issue-open" target="_blank" rel="noopener noreferrer" data-i18n="review.openInTab"></a>
            </p>
            <div class="row">
              <button type="submit" id="accept" class="primary"></button>
              <button type="button" id="verify" class="primary" data-i18n="review.verify"></button>
              <button type="button" id="skip" data-i18n="review.skip"></button>
              <button type="button" id="back" data-i18n="review.back"></button>
            </div>
            <p id="verify-hint" class="hint" hidden></p>
            <div class="row">
              <button type="button" id="remove-tag" data-i18n="review.removeTag"></button>
              <button type="button" id="close-open" data-i18n="review.closure"></button>
              <button type="button" id="note-open" data-i18n="review.note"></button>
            </div>
            <p id="issue-note" class="hint" hidden></p>
          </form>
          <form id="note" class="notice" hidden>
            <p data-i18n-html="note.intro"></p>
            <label for="note-text" data-i18n="note.text"></label>
            <textarea id="note-text" rows="5"></textarea>
            <div class="row">
              <button type="submit" id="note-create" class="primary" data-i18n="note.create"></button>
              <button type="button" id="note-cancel" data-i18n="note.cancel"></button>
            </div>
            <p id="note-status" class="hint"></p>
          </form>
          <form id="closure" class="notice" hidden>
            <p data-i18n-html="closure.title"></p>
            <table id="closure-tags" class="tags"></table>
            <p id="closure-result" class="hint"></p>
            <div class="row">
              <button type="submit" id="closure-apply" class="primary" data-i18n="closure.apply"></button>
              <button type="button" id="closure-cancel" data-i18n="closure.cancel"></button>
            </div>
            <p class="hint" data-i18n="closure.hint"></p>
          </form>
          <p class="hint keys" data-i18n-html="review.keys"></p>
        </div>
        <p id="review-done" data-i18n="review.done" hidden></p>
        <p id="no-issues" data-i18n="review.noIssues" hidden></p>
        <div class="row">
          <button type="button" id="to-upload" class="primary"></button>
          <button type="button" id="restart" data-i18n="review.restart"></button>
        </div>
      </section>

      <section id="step-upload" hidden>
        <h2><span data-i18n="upload.title"></span> <a class="help" data-help="upload" data-i18n-title="app.helpStep" data-i18n-aria-label="app.helpStep">?</a></h2>
        <div id="upload-form">
          <p data-i18n="upload.intro"></p>
          <ul id="diff" class="diff"></ul>
          <label for="comment" data-i18n="upload.comment"></label>
          <textarea id="comment" rows="3" required></textarea>
          <p id="comment-count" class="hint"></p>
          <div class="row">
            <button type="button" id="upload" class="primary" data-i18n="upload.button"></button>
            <button type="button" id="upload-back" data-i18n="upload.back"></button>
          </div>
        </div>
        <p id="upload-status" class="hint"></p>
        <div id="upload-done" class="row" hidden>
          <button type="button" id="upload-continue" class="primary" data-i18n="upload.continue"></button>
          <button type="button" id="upload-restart" data-i18n="upload.restart"></button>
        </div>
        <p id="upload-login-box" hidden>
          <span data-i18n="upload.loginNeeded"></span>
          <button type="button" id="upload-login" class="primary" data-i18n="login.button"></button>
        </p>
        <ul id="conflicts" class="diff conflicts"></ul>
      </section>

      <footer class="site-links">
        <label>
          <span data-i18n="app.language"></span>
          <select id="language"></select>
        </label>
        ·
        <a data-help="" data-i18n="app.help"></a> · <a href="./impressum.html" data-i18n="app.imprint"></a> · <a href="./datenschutz.html" data-i18n="app.privacy"></a> ·
        <a href="https://github.com/cyper85/osmCorrection" target="_blank" rel="noopener" data-i18n="app.source"></a>
      </footer>
    </aside>
    <main id="map"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
